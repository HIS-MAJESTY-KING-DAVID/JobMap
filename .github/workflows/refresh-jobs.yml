name: Refresh JobMap feed

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run nationwide smoke tests
        run: npm run test:smoke

      - name: Fetch and publish active jobs
        env:
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
        run: npm run ingest

      - name: Commit feed changes
        run: |
          if git diff --quiet -- public/jobs.json public/ingestion-meta.json; then
            echo "No feed changes to publish."
            exit 0
          fi
          git config user.name "jobmap-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/jobs.json public/ingestion-meta.json
          git commit -m "chore: refresh job feed"
          git push
