name: OWASP ZAP baseline

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Public staging or production URL to scan
        required: true
        default: https://jobmap-ten.vercel.app
        type: string

permissions:
  contents: read

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Passive OWASP ZAP scan
    steps:
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ inputs.target_url }}
          allow_issue_writing: false
          fail_action: false
          cmd_options: "-m 2"
